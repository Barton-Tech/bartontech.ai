name: daily collect

on:
  schedule:
    # Four hours after submit. Batches usually finish well inside that; any
    # that have not are left pending and picked up by the next run.
    - cron: '10 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run collect:daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Rotates one problem off the board each day and asks all three models
      # how they would attack it. Cheap (~$0.08/day) and independent of the
      # day's tracker data, so a batch that is not ready does not block it.
      - run: npm run solutions:daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: commit results
        run: |
          git config user.name  'bartontech-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "collect: $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
