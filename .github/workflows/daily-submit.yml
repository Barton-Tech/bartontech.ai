name: daily submit

# STOPPED 2026-08-19. The vendor tracker no longer feeds the site, so the
# nightly submit is off. The collected series in data/tracker and data/raw is
# preserved and append-only; note the gap begins 2026-08-19 if this resumes.
# To resume: restore the cron below and the collect step in daily-answers.yml.
on:
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run submit:daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - name: commit pending batches
        run: |
          git config user.name  'bartontech-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "submit: $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
