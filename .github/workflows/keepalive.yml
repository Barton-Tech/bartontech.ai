name: keepalive

# GitHub disables scheduled workflows after 60 days without repository
# activity. The daily bot commits should count, but this removes the doubt:
# a monthly no-op touch guarantees the schedules keep firing.
on:
  schedule:
    - cron: '0 12 15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  'bartontech-bot'
          git config user.email 'bot@users.noreply.github.com'
          date -u +%FT%TZ > .keepalive
          git add .keepalive
          git diff --staged --quiet || git commit -m 'keepalive'
          git push
